server.port=8080

# Gizli değerler booking/.env dosyasından (UTF-8) veya ortam değişkenlerinden okunur
# (bkz. config/DotenvEnvironmentPostProcessor)

# Veritabanı bağlantısı: tüm değerler .env dosyasından gelir (varsayılan yok)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Yönetici paneli şifresi. Varsayılanı yok: .env veya ortam değişkeninde ADMIN_PASSWORD tanımlanmalı.
app.admin.password=${ADMIN_PASSWORD:}

# Frontend adresleri (virgülle ayrılır). Canlıya alırken alan adını buraya ekle.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# SMS sağlayıcısı: "netgsm" = gerçek SMS, "log" = SMS göndermez, kodu sunucu loguna yazar (sadece geliştirme).
app.sms.provider=${SMS_PROVIDER:log}
app.sms.netgsm.usercode=${NETGSM_USERCODE:}
app.sms.netgsm.password=${NETGSM_PASSWORD:}
# Netgsm'de onaylı gönderici başlığı (örn. ARIFTUZUNAL)
app.sms.netgsm.header=${NETGSM_HEADER:}

# Galeri fotoğraflarının kaydedildiği klasör (varsayılan: booking/uploads)
app.uploads.dir=${UPLOAD_DIR:${dotenv.dir:.}/uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Müşteriye giden SMS'lerde görünen işletme bilgisi
app.business.name=${BUSINESS_NAME:}
app.business.phone=${BUSINESS_PHONE:}
